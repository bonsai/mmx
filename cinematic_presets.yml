# MMX Cinematic Camera & Lighting Presets (v1.3.0+)
# Usage: Load in Blender via agents/blender_agent.py --apply-preset <preset_name>

presets:
  # ============================================================
  # ORBITAL PRESETS - Camera orbits spacecraft
  # ============================================================
  orbital_close:
    name: "Orbital Close (Detail Shots)"
    description: "Close orbit for component detail, 2 orbits"
    camera:
      lens_mm: 35.0
      orbit_distance: 20.0
      orbit_height: 5.0
      orbits_per_animation: 2.0
      vertical_oscillation: 3.0
      follow_offset_y: -10.0
      follow_offset_z: 0.0
    lighting:
      sun_energy: 12.0
      fill_energy: 2.5
      rim_energy: 1.5
      world_strength: 0.4
    duration_sec: 8.0
    use_case: ["component_detail", "thermal_blanket_closeup", "solar_array_deploy"]

  orbital_standard:
    name: "Orbital Standard (v1.3.0 Default)"
    description: "Balanced view, full spacecraft visible, 1 orbit"
    camera:
      lens_mm: 28.0
      orbit_distance: 45.0
      orbit_height: 12.0
      orbits_per_animation: 1.0
      vertical_oscillation: 8.0
      follow_offset_y: -20.0
      follow_offset_z: 0.0
    lighting:
      sun_energy: 15.0
      fill_energy: 3.0
      rim_energy: 2.0
      world_strength: 0.5
    duration_sec: 10.0
    use_case: ["hero_shot", "mission_overview", "web_viewer_default"]

  orbital_wide:
    name: "Orbital Wide (Context/Environment)"
    description: "Pulled back for space context, 0.5 orbit slow"
    camera:
      lens_mm: 24.0
      orbit_distance: 80.0
      orbit_height: 20.0
      orbits_per_animation: 0.5
      vertical_oscillation: 15.0
      follow_offset_y: -40.0
      follow_offset_z: 5.0
    lighting:
      sun_energy: 18.0
      fill_energy: 4.0
      rim_energy: 3.0
      world_strength: 0.6
    duration_sec: 15.0
    use_case: ["trajectory_visualization", "planetary_approach", "mission_trailer"]

  orbital_ultra_wide:
    name: "Ultra Wide (Cinematic Establishing)"
    description: "Maximum context, spacecraft small in vast space"
    camera:
      lens_mm: 18.0
      orbit_distance: 150.0
      orbit_height: 40.0
      orbits_per_animation: 0.25
      vertical_oscillation: 25.0
      follow_offset_y: -80.0
      follow_offset_z: 10.0
    lighting:
      sun_energy: 20.0
      fill_energy: 5.0
      rim_energy: 4.0
      world_strength: 0.7
    duration_sec: 20.0
    use_case: ["opening_shot", "mission_poster", "documentary_wide"]

  # ============================================================
  # FLYBY PRESETS - Camera fixed, spacecraft flies past
  # ============================================================
  flyby_side:
    name: "Side Flyby (Profile View)"
    description: "Camera fixed, spacecraft flies laterally across frame"
    camera:
      type: "fixed"
      lens_mm: 35.0
      position: [0, 0, 10]
      rotation: [1.2, 0, 0]  # Looking slightly down
      track_target: true
    spacecraft_path:
      start: [-100, -50, 5]
      end: [100, 50, 5]
      banking: 15.0
    lighting:
      sun_energy: 15.0
      fill_energy: 3.0
      rim_energy: 2.5
    duration_sec: 8.0
    use_case: ["profile_silhouette", "solar_array_glint", "thermal_signature"]

  flyby_approach:
    name: "Approach Flyby (Coming at Camera)"
    description: "Spacecraft flies toward and past camera"
    camera:
      type: "fixed"
      lens_mm: 24.0
      position: [0, 0, 0]
      rotation: [1.57, 0, 0]  # Looking along -Y
      track_target: true
    spacecraft_path:
      start: [0, -200, 10]
      end: [0, 50, 10]
      banking: 0.0
    lighting:
      sun_energy: 15.0
      fill_energy: 4.0
      rim_energy: 3.0
    duration_sec: 10.0
    use_case: ["dramatic_approach", "thruster_fire", "landing_sequence"]

  flyby_departure:
    name: "Departure Flyby (Receding)"
    description: "Spacecraft accelerates away from camera"
    camera:
      type: "fixed"
      lens_mm: 50.0
      position: [0, 0, 5]
      rotation: [1.57, 0, 0]
      track_target: true
    spacecraft_path:
      start: [0, -10, 5]
      end: [0, -200, 20]
      banking: -5.0
    lighting:
      sun_energy: 12.0
      fill_energy: 2.0
      rim_energy: 1.0
    duration_sec: 12.0
    use_case: ["departure_burn", "cruise_phase", "ending_shot"]

  # ============================================================
  # CINEMATIC SEQUENCE PRESETS - Multi-shot sequences
  # ============================================================
  mission_trailer_30s:
    name: "30-Second Mission Trailer"
    description: "Multi-shot cinematic sequence"
    shots:
      - preset: "orbital_ultra_wide"
        duration: 5.0
        label: "Opening - Space Context"
      - preset: "flyby_approach"
        duration: 4.0
        label: "Approach"
      - preset: "orbital_standard"
        duration: 8.0
        label: "Hero Orbit"
      - preset: "orbital_close"
        duration: 5.0
        label: "Detail Pass"
      - preset: "flyby_departure"
        duration: 6.0
        label: "Departure Burn"
      - preset: "orbital_wide"
        duration: 2.0
        label: "Fade to Trajectory"
    total_duration: 30.0
    transitions: ["crossfade", "cut", "crossfade", "cut", "crossfade", "fade_to_black"]

  technical_review_60s:
    name: "60-Second Technical Review"
    description: "Systematic component inspection"
    shots:
      - preset: "orbital_standard"
        duration: 10.0
        label: "Full Vehicle"
      - preset: "orbital_close"
        duration: 8.0
        label: "Propulsion Module"
      - preset: "orbital_close"
        duration: 8.0
        label: "Return Module"
      - preset: "orbital_close"
        duration: 8.0
        label: "Exploration Module"
      - preset: "orbital_close"
        duration: 8.0
        label: "Landing Legs"
      - preset: "orbital_close"
        duration: 8.0
        label: "Solar Arrays"
      - preset: "orbital_wide"
        duration: 10.0
        label: "Full Stack Context"
    total_duration: 60.0
    transitions: ["cut"] * 6

  # ============================================================
  # LIGHTING MOOD PRESETS
  # ============================================================
  lighting:
    standard:  # v1.3.0 baseline
      sun_energy: 15.0
      sun_color: [1.0, 0.95, 0.9]
      sun_angle: 0.53
      fill_energy: 3.0
      fill_color: [0.3, 0.4, 0.6]
      rim_energy: 2.0
      rim_color: [0.2, 0.3, 0.5]
      world_strength: 0.5
      world_star_density: 0.95
      exposure: 1.0

    high_contrast:
      sun_energy: 20.0
      fill_energy: 1.0
      rim_energy: 3.0
      world_strength: 0.3
      description: "Harsh shadows, dramatic terminator"

    soft_ambient:
      sun_energy: 10.0
      fill_energy: 5.0
      rim_energy: 1.0
      world_strength: 0.7
      description: "Even lighting, minimal shadows"

    golden_hour:
      sun_energy: 12.0
      sun_color: [1.0, 0.85, 0.6]
      fill_energy: 2.0
      fill_color: [0.4, 0.3, 0.2]
      rim_energy: 1.5
      world_strength: 0.4
      description: "Warm tone, planetary reflection"

    eclipse:
      sun_energy: 2.0
      fill_energy: 1.0
      rim_energy: 0.5
      world_strength: 0.8
      description: "In shadow, starfield dominant"

    mars_approach:
      sun_energy: 14.0
      sun_color: [1.0, 0.9, 0.7]
      fill_energy: 2.5
      fill_color: [0.6, 0.3, 0.1]
      rim_energy: 1.5
      world_strength: 0.4
      description: "Mars reddish ambient"

  # ============================================================
  # RENDER QUALITY PRESETS
  # ============================================================
  render_quality:
    draft:
      engine: "EEVEE"
      samples: 8
      resolution: [1280, 720]
      fps: 30
      description: "Fast iteration"

    standard:
      engine: "EEVEE"
      samples: 16
      resolution: [1920, 1080]
      fps: 30
      description: "Production standard"

    high:
      engine: "CYCLES"
      samples: 128
      resolution: [1920, 1080]
      fps: 30
      denoiser: "OPTIX"
      description: "High quality stills"

    ultra:
      engine: "CYCLES"
      samples: 256
      resolution: [3840, 2160]
      fps: 30
      denoiser: "OPTIX"
      description: "4K final render"