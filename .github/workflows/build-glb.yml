name: Build MMX GLB from STL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "models/source.stl"
      - "agents/blender_import_mmx.py"
      - ".github/workflows/build-glb.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-mmx-glb
  cancel-in-progress: false

jobs:
  build-glb:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install --yes blender
          blender --version
      - name: Convert STL to GLB
        run: blender --background --python agents/blender_import_mmx.py
      - name: Provide compatibility model path
        run: cp web/models/mmx_lowpoly.glb web/models/mmx.glb
      - name: Verify output
        run: |
          test -s web/models/mmx_lowpoly.glb
          test -s web/models/mmx.glb
          file web/models/mmx_lowpoly.glb web/models/mmx.glb
          ls -lh web/models/mmx_lowpoly.glb web/models/mmx.glb
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Include flight videos
        run: mkdir -p web/video && cp video/MMX_space_flight_5sec.mp4 video/MMX_space_flight_15sec.mp4 video/MMX_space_flight_v130.mp4 web/video/
      - name: Verify flight videos
        run: ls -lh web/video/*.mp4
      - name: Upload viewer with generated GLB
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Commit generated GLB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/models/mmx_lowpoly.glb web/models/mmx.glb
          if git diff --cached --quiet; then
            echo "Generated GLB is unchanged."
          else
            git commit -m "build: regenerate MMX GLB from source STL"
            git push origin HEAD:main
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build-glb
    steps:
      - name: Deploy viewer
        id: deployment
        uses: actions/deploy-pages@v4
